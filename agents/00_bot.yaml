# Интерфейс: Telegram-бот. Не агент — оркестратор и единственная точка входа человека.
name: segregator-bot
label: "Segregator Bot"
plane: local

description: >
  Слушает канал, ставит документы в очередь, гоняет их через конвейер агентов,
  задаёт вопросы карточками с кнопками и выдаёт реестры. Он же — консоль
  общения с локальной моделью и с любым из четырёх агентов напрямую.

access:
  mode: whitelist
  allowed_user_ids: [${OWNER_USER_ID}]
  on_unknown: { reply: none, log: true }

modes:
  idle:   { llm: unloaded, ocr_pool: 0, poll_timeout_s: 50 }
  active: { llm: lazy_load, ocr_pool: 2, unload_after_idle_min: 10 }
  batch:  { llm: loaded, ocr_pool: 4, cards: digest, window: "02:00-06:00" }

commands:
  - "/status        — режим, очередь, последний прогон, свободное место"
  - "/reindex [год] — полный прогон бэкфилла в BATCH"
  - "/rejestr YYYY-MM — XLSX-реестр за месяц"
  - "/pending       — что ждёт твоего решения"
  - "/ask <агент> <вопрос> — прямой диалог с агентом 01..04 на локальной модели"
  - "/sim <сценарий> — запуск симуляции у Agent-Doradca"
  - "/rules reload  — перечитать rules.yaml"
  - "/boundary      — что уходило наружу за последние 30 дней (должно быть пусто, кроме KSeF)"

cards:
  trigger: "уверенность ниже порога категории или случай из always_ask"
  contains:
    - "превью первой страницы, ужатое"
    - "извлечённые поля с пометкой источника"
    - "предложенная категория и до трёх альтернатив кнопками"
    - "строка «почему»: правило или ступень каскада"
    - "кнопки: другая…, дубль, не документ"
  on_answer:
    - "документ переезжает в выбранную категорию, оба дерева обновляются"
    - "ответ пишется в precedents"
    - "после трёх однотипных решений бот предлагает готовое правило для rules.yaml"
