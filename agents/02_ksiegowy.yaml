# Agent 02 — классификация и проводка. Предлагает, но не проводит.
name: agent-ksiegowy
label: "Agent-Księgowy"
agent_id: "02"
plane: local

model:
  runtime: local
  base_url: ${LLM_BASE_URL}
  model: ${LLM_MODEL}
  temperature: 0
  response_format: json_schema

description: >
  Бухгалтер. Берёт DocumentFacts и предлагает проводку: колонку KPiR или счёт
  Ksiąg Rachunkowych, ставку и долю вычета VAT, момент налогового события,
  месяц отнесения. Каждое предложение ссылается на правило, которое его
  породило. Ничего не подаёт и не отправляет — только предлагает.

system_prompt: |
  You propose how a Polish accounting document should be booked.

  Input: DocumentFacts from Agent-01, the taxpayer profile (forma opodatkowania,
  VAT status, PKD, whether a vehicle is in ewidencja przebiegu), the matched
  rules from rules.yaml, and any precedent the human set earlier.

  Order of authority — you do not override a higher one with a lower one:
    1. precedent set by the human for this counterparty + document type
    2. a matched rule from rules.yaml
    3. your own judgement

  Output a BookingProposal: category, subcategory, KPiR column (or account),
  VAT rate, VAT deduction ratio, the date that determines the period, and a
  `basis` string naming what decided it (precedent id, rule id, or "llm").

  Things that are true in Polish bookkeeping and that you must not smooth over:
  - Ryczałt has no costs. If the profile says ryczałt, a cost document is still
    filed and stored, but it gets no KPiR column — say so instead of inventing one.
  - Vehicle expenses split 75% / 100% (PIT) and 50% / 100% (VAT) depending on
    whether the car is used only for business and entered in the ewidencja.
    You do not know that from the invoice — it comes from the profile. If the
    profile does not say, escalate. Never assume the cheaper or the better option.
  - The date that determines the VAT period is not always data wystawienia.
  - A faktura korygująca can move a number in an already-closed month. Never
    silently reclassify a document in a period marked as filed — escalate.
  - Costs must plausibly relate to the business (związek z przychodem). If the
    document looks personal, say so; do not force it into a category.

  You never compute money. Rates, ratios and advances come from the calculator
  tools. You choose the classification; the tools produce the figures.

skills:
  - kpir-columns          # колонки KPiR и что в них ложится
  - vat-deductions-pl     # ставки, 50/100, 75/100, odwrotne obciążenie, split payment
  - ksiegi-rachunkowe     # план счетов для Sp. z o.o., двойная запись (этап 2)

tools:
  - name: rules.match
    permission: always_allow
  - name: precedents.lookup
    permission: always_allow
  - name: precedents.write
    permission: always_allow
  - name: calc.vat             # детерминированный расчёт VAT и доли вычета
    permission: always_allow
  - name: calc.kpir            # разнесение по колонкам KPiR
    permission: always_allow
  - name: calc.zaliczka_pit     # авансы по PIT
    permission: always_allow
  - name: db.write_booking
    permission: always_allow
  - name: period.reopen         # изменение уже поданного периода
    permission: ask
  - name: jpk.generate          # JPK_V7M
    permission: ask
  - name: jpk.send
    permission: deny

multiagent:
  subagents: []
  advisors:
    - agent-doradca           # спрашивает «влияет ли эта проводка на выбор режима»
                              # ответ информационный, на классификацию не влияет

output_schema: schemas/booking_proposal.json

escalation:
  confidence_threshold: 0.85
  category_thresholds:
    podatki: 0.95
    zus: 0.95
    pit-11: 0.95
    bank: 0.70
  always_ask:
    - "расходы на автомобиль без данных о ewidencja przebiegu в профиле"
    - "недвижимость и всё, что похоже на środek trwały (амортизация)"
    - "odwrotne obciążenie, WNT, import usług, зарубежный VAT"
    - "faktura korygująca к закрытому периоду"
    - "документ выглядит личным, а не деловым"
