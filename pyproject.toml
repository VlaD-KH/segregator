[project]
name = "segregator"
version = "0.1.0"
description = "Локальный разбор Telegram-канала «бухгалтерия» в архив: дерево папок, SQLite, XLSX-реестр"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.28",
    "pydantic>=2.12",
    "pydantic-settings>=2.12",
    "httpx>=0.28",
    "typer>=0.25",
    "structlog>=24.1",
    # Потоковый разбор result.json: экспорт за год не обязан влезать в память.
    "ijson>=3.5",
    # Разбор HTML-экспорта Telegram Desktop (messages*.html). Бэкенд html.parser
    # из stdlib — без lxml, чтобы ничего не компилировать на iGPU-машине.
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
# Тестовое окружение: `pip install -e ".[dev]"`. Без этого свежий клон
# не соберёт pytest, и приёмка проекта («проверяется тестами, а не глазами»)
# недоступна на чистой машине.
dev = ["pytest>=9.0"]

[project.scripts]
segregator = "segregator.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
