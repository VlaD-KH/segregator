<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}prospektor{% endblock %}</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#16181d; --muted:#6b7280;
          --line:#e5e7eb; --accent:#1d4ed8; --bad:#b91c1c; --good:#047857; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111318; --fg:#e9eaee; --muted:#9aa1ad; --line:#282c34;
            --accent:#7ea2ff; --bad:#f87171; --good:#34d399; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 system-ui, sans-serif; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex;
           gap:14px; align-items:baseline; }
  header b { font-size:16px; }
  header span { color:var(--muted); }
  main { padding:20px; }
  a { color:var(--accent); }
  form.filters { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; align-items:center; }
  select, input, button { font:inherit; padding:6px 9px; border:1px solid var(--line);
           border-radius:7px; background:var(--bg); color:var(--fg); }
  button { cursor:pointer; }
  .wrap { overflow-x:auto; border:1px solid var(--line); border-radius:10px; }
  table { border-collapse:collapse; width:100%; min-width:900px; }
  th, td { padding:8px 10px; text-align:left; border-bottom:1px solid var(--line);
           vertical-align:top; }
  th { font-weight:600; color:var(--muted); font-size:12px; text-transform:uppercase;
       letter-spacing:.03em; position:sticky; top:0; background:var(--bg); }
  tr:last-child td { border-bottom:none; }
  .num { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .gap { color:var(--bad); font-weight:600; }
  .fit { color:var(--good); font-weight:600; }
  .why { color:var(--muted); max-width:380px; }
  .pill { display:inline-block; padding:1px 7px; border:1px solid var(--line);
          border-radius:999px; font-size:12px; color:var(--muted); }
  dl.sig { display:grid; grid-template-columns:minmax(200px,auto) 1fr; gap:2px 16px; }
  dl.sig dt { color:var(--muted); font-family:ui-monospace, monospace; font-size:12px; }
  dl.sig dd { margin:0; }
  pre { white-space:pre-wrap; }
</style>
</head>
<body>
<header>
  <b><a href="/" style="text-decoration:none;color:inherit">prospektor</a></b>
  <span>{% block subtitle %}{% endblock %}</span>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
