# Названия, которые вообще не являются названиями бизнеса
junk_name_patterns:
  # Точка на карте, названная адресом, а не именем: «Stargard Ul. Wojska Polskiego».
  # Точка после «ul» обязательна, иначе под шаблон попадут живые названия вроде «u Uli».
  - '\bul\.\s'
  - '\bulica\s'
  - '^\d+\s*$'
