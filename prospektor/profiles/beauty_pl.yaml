# Профиль скоринга: индустрия красоты, Польша.
#
# Пилотная вертикаль выбрана по данным, а не по вкусу. В Старгарде салонов 238
# против 157 заведений HoReCa, без сайта 62% против 48%, и 32 точки живут
# исключительно на поддомене Booksy. В Щецине картина та же на порядок большей
# выборке: beauty_salon и spas — две крупнейшие категории города после «прочих услуг».
#
# Экономика здесь другая, чем в доставке еды, и это отражено в формулировках:
# Booksy берёт абонентскую плату за место на площадке, а не процент с записи.
# Поэтому питч не про комиссию, а про то, что клиент принадлежит площадке.

name: beauty_pl
label: Uroda i pielęgnacja
categories: beauty_pl

gap:
  rules:
    # --- присутствие: главный разрыв вертикали ------------------------
    - signal: web.has_site
      expect: true
      weight: 18
      title: "Сделать собственную страницу с услугами, ценами и записью"
      why: "Шесть салонов из десяти в городе не имеют сайта вообще — показать нечего ни человеку, ни ассистенту"
    - signal: web.platform_profile_only
      expect: false
      weight: 14
      title: "Завести свою площадку рядом с профилем на платформе"
      why: "Всё присутствие сводится к профилю на чужой площадке: клиент принадлежит ей, а не салону, и правила меняются без спроса"
    - signal: web.only_social
      expect: false
      weight: 8
      title: "Перенести услуги и цены из соцсети на свой сайт"
      why: "Инстаграм не отдаёт разметку и не индексируется как каталог услуг"
    - signal: web.is_placeholder
      expect: false
      weight: 6
      title: "Заменить заглушку рабочей страницей"

    # --- запись: у красоты это ядро операционки ------------------------
    - signal: ops.reservation
      expect: true
      weight: 14
      title: "Подключить онлайн-запись"
      why: "Запись по телефону теряет всё, что приходит вечером и в выходные — а это основное время, когда ищут мастера"
    - signal: ops.booking_platform_only
      expect: false
      weight: 8
      title: "Добавить запись на собственной странице рядом с площадкой"
      why: "Booksy берёт абонплату за место на площадке; своя запись не заменяет её, но возвращает контакт клиента салону"
    - signal: ops.phone_only
      expect: false
      weight: 10
      title: "Открыть канал записи кроме телефона"
      why: "Единственный способ записаться — дозвониться в рабочие часы"
    - signal: ops.chat
      expect: true
      weight: 3
      title: "Добавить мессенджер для вопросов до записи"

    # --- читаемость для ИИ-ассистентов ---------------------------------
    - signal: aio.localbusiness_schema
      expect: true
      weight: 10
      title: "Внедрить разметку Schema.org (LocalBusiness / HealthAndBeautyBusiness)"
      why: "Запрос «маникюр рядом, сегодня вечером» ассистент отрабатывает по разметке — без неё салона в ответе нет"
    - signal: aio.opening_hours_schema
      expect: true
      weight: 6
      title: "Вынести часы работы в разметку"
      why: "«Открыто сейчас» проверяется по структурированным часам, а не по картинке в шапке"
    - signal: aio.ai_crawlers_allowed
      expect: true
      weight: 6
      title: "Открыть в robots.txt роботов ИИ-поиска"
      why: "Закрытый GPTBot или ClaudeBot означает отсутствие в ответах ассистентов"
    - signal: aio.js_dependent
      expect: false
      weight: 5
      title: "Отдавать услуги и цены в HTML, не только после JS"
    - signal: aio.jsonld_broken
      expect: false
      weight: 4
      title: "Починить существующую разметку"
      why: "Блок есть, но не разбирается — самая дешёвая правка из всего списка"
    - signal: aio.price_in_markup
      expect: true
      weight: 5
      title: "Опубликовать прайс машиночитаемо"
      why: "Фильтр по бюджету отсекает салоны, у которых цены только на картинке"

    # --- SEO и согласованность ----------------------------------------
    - signal: seo.indexable
      expect: true
      weight: 5
      title: "Снять запрет индексации"
    - signal: seo.nap_phone_match
      expect: true
      weight: 4
      title: "Свести телефон на сайте, карте и в записи"
      why: "Расхождение NAP снижает локальные позиции и путает ассистента"
    - signal: web.mobile_viewport
      expect: true
      weight: 5
      title: "Починить мобильную вёрстку"
      why: "Мастера ищут с телефона почти всегда"
    - signal: seo.title_ok
      expect: true
      weight: 3
    - signal: seo.description_ok
      expect: true
      weight: 3

fit:
  # У красоты отзывов обычно меньше, чем у ресторанов: салон обслуживает
  # десятки клиентов в неделю, а не сотни. Порог насыщения ниже соответственно.
  reviews:
    weight: 45
    log_scale: true
    saturate_at: 120
  rating:
    weight: 30
    floor: 3.5
    ceiling: 4.9
  reachability:
    weight: 25

priority:
  alpha: 0.55
